<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>hwp-editor gate host</title>
<style>html,body{margin:0;height:100%}#editor{width:1200px;height:800px}</style>
</head>
<body>
<div id="editor"></div>
<script type="module">
// Gate host: embeds the studio from another origin through @rhwp/editor, exactly like
// clipboardapp.org will. Results are exposed on window.__gate for gate/run.mjs.
import { createStudio } from '/node_modules/@rhwp/editor/index.js'

const params = new URLSearchParams(location.search)
const studioUrl = params.get('studio')
const marker = params.get('marker')
const steps = []
const step = (name, data) => { steps.push({ name, at: Math.round(performance.now()), ...(data || {}) }) }
const b64 = (u8) => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode(...u8.subarray(i, i + 0x8000)); return btoa(s) }

window.__gate = { done: false, steps }
;(async () => {
  try {
    const studio = await createStudio(document.getElementById('editor'), { studioUrl, plugins: ['hwpctrl'] })
    step('createStudio')
    // used by gate/run.mjs for the font mapping check (a document that names excluded fonts)
    window.__gateLoad = async (b64) => {
      const u8 = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0))
      const r = await studio.loadFile(u8, 'fonts.hwpx', { skipUnsavedGuard: true })
      const svg = await studio.getPageSvg(0)
      const text = await studio.hwpctrl.call('GetTextFile', ['TEXT', ''])
      return { pageCount: r.pageCount, svgBytes: svg.length, text: String(text).slice(0, 200) }
    }
    // 저장소의 실제 샘플(hwp/hwpx)을 열고 고쳐서 내보낸 뒤 다시 열어 비교한다 (gate/run.mjs 가 부른다)
    window.__gateSample = async (b64, name, mark) => {
      const u8 = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0))
      const r = await studio.loadFile(u8, name, { skipUnsavedGuard: true })
      const before = String(await studio.hwpctrl.call('GetTextFile', ['TEXT', '']))
      await studio.hwpctrl.batch((h) => { h.SetTextFile(mark, 'TEXT', '') })
      const edited = String(await studio.hwpctrl.call('GetTextFile', ['TEXT', '']))
      const bytes = await studio.hwpctrl.exportBytes('hwpx')
      const r2 = await studio.loadFile(bytes, 'sample-roundtrip.hwpx', { skipUnsavedGuard: true })
      const after = String(await studio.hwpctrl.call('GetTextFile', ['TEXT', '']))
      return { name, pages: r.pageCount, textBefore: before.length, hasMarkerEdited: edited.includes(mark),
        exportedBytes: bytes.length, pagesAfter: r2.pageCount, hasMarkerAfterReload: after.includes(mark), textAfter: after.length }
    }
    const plugins = await studio.plugins.list()
    step('plugins', { plugins })

    // 1. synthetic HWPX: a new blank document made by the engine, exported as HWPX bytes
    const nd = await studio.commands.execute('file:new-doc', {}, { allowDialog: true })
    step('new-doc', { result: nd })
    const synthetic = await studio.exportHwpx()
    step('export-synthetic', { bytes: synthetic.length })

    // 2. load those bytes from the host side
    const loaded = await studio.loadFile(synthetic, 'synthetic.hwpx')
    step('load-synthetic', { pageCount: loaded.pageCount })

    // 3. insert text through HwpCtrl in one batch
    const batch = await studio.hwpctrl.batch((h) => { h.SetTextFile(marker, 'TEXT', '') })
    step('batch', { result: batch })
    const textBefore = await studio.hwpctrl.call('GetTextFile', ['TEXT', ''])
    step('text-before-export', { hasMarker: String(textBefore).includes(marker) })

    // 4. export and re-open the exported bytes
    const exported = await studio.hwpctrl.exportBytes('hwpx')
    step('exportBytes', { bytes: exported.length })
    const reloaded = await studio.loadFile(exported, 'roundtrip.hwpx', { skipUnsavedGuard: true })
    step('reload', { pageCount: reloaded.pageCount })
    const textAfter = await studio.hwpctrl.call('GetTextFile', ['TEXT', ''])
    const svg = await studio.getPageSvg(0)
    step('text-after-reload', { hasMarker: String(textAfter).includes(marker), svgBytes: svg.length })

    // theme from the host: the cross-origin replacement for writing localStorage 'rhwp-settings'
    const themeDark = await studio.commands.execute('view:theme-dark')
    const skinFlat = await studio.commands.execute('view:skin-flat')
    step('theme', { themeDark, skinFlat })

    // 5. agent: Clipboard Share 의 AI 편집 함수를 다른 출처에서 postMessage 창구(agent/client.js -> agent/bridge.js)로 부른다
    const { createAgentClient } = await import('/agent/client.js')
    const { AGENT_METHODS } = await import('/agent/hwpAgentMethods.js')
    const studioOrigin = new URL(studioUrl).origin
    const agent = createAgentClient({ getFrameWindow: () => studio.element.contentWindow, origin: studioOrigin, methods: AGENT_METHODS })
    const ag = {}
    await studio.loadFile(synthetic, 'agent.hwpx', { skipUnsavedGuard: true })
    const o1 = await agent.outline()
    ag.outlineCount = o1.length
    ag.expectMismatch = await agent.replaceParagraph(0, 'x', { expect: o1[0].text + '#' }).then(() => null, (e) => e.code)
    ag.replace = await agent.replaceParagraph(0, '에이전트 제목 ' + marker, { expect: o1[0].text })
    const p1 = await agent.insertParagraphAfter(0, '에이전트 둘째 문단')
    const cells = [['구분', '항목', '내용', '비고'], ['1', 'A', '가', ''], ['2', 'B', '나', ''], ['3', 'C', '다', '']]
    const tbl = await agent.insertTable(p1.i, { rows: 4, cols: 4, cells, header: { bold: true, align: 'center' } })
    ag.table = { rows: tbl.rows, cols: tbl.cols, same: JSON.stringify((await agent.getTable(tbl.para, tbl.ctrlIdx)).cells) === JSON.stringify(cells) }
    const n0 = (await agent.outline()).length
    await agent.edit('gate 묶음', (a) => { const p = a.insertParagraphAfter(0, '묶음 1'); a.insertParagraphAfter(p.i, '묶음 2') })
    const n1 = (await agent.outline()).length
    await agent.undo()
    const n2 = (await agent.outline()).length
    ag.editUndo = { before: n0, mid: n1, after: n2, oneStep: n1 === n0 + 2 && n2 === n0 }
    const texts1 = (await agent.outline()).map((p) => p.text)
    const pages1 = await studio.pageCount()
    const agentBytes = await studio.exportHwpx()
    await studio.loadFile(agentBytes, 'agent-reopen.hwpx', { skipUnsavedGuard: true })
    const texts2 = (await agent.outline()).map((p) => p.text)
    const objs = await agent.listObjects()
    const t2 = objs.find((o) => o.kind === 'table')
    ag.reopen = { pages1, pages2: await studio.pageCount(), sameTexts: JSON.stringify(texts1) === JSON.stringify(texts2),
      tableSame: !!t2 && JSON.stringify((await agent.getTable(t2.para, t2.ctrlIdx)).cells) === JSON.stringify(cells) }
    ag.deleteObject = t2 ? await agent.deleteObject({ para: t2.para, ctrlIdx: t2.ctrlIdx }) : null
    ag.tablesAfterDelete = (await agent.listObjects()).filter((o) => o.kind === 'table').length
    ag.dialogs = await agent.dialogs()
    ag.status = await agent.status()
    // 목록에 없는 함수는 studio 가 거절한다
    ag.unknown = await new Promise((resolve) => {
      const id = 'gate-unknown'
      const on = (ev) => { if (ev.data && ev.data.id === id && 'ok' in ev.data) { removeEventListener('message', on); resolve(ev.data.error && ev.data.error.code) } }
      addEventListener('message', on)
      studio.element.contentWindow.postMessage({ cbHwpAgent: 1, id, method: 'constructor', args: [] }, studioOrigin)
      setTimeout(() => resolve('no-answer'), 5000)
    })
    step('agent', ag)
    window.__gate.agent = ag

    Object.assign(window.__gate, {
      done: true,
      ok: true,
      syntheticBytes: synthetic.length,
      exportedBytes: exported.length,
      exportedBase64: b64(exported),
      textAfter: String(textAfter).slice(0, 500),
      markerInTextAfterReload: String(textAfter).includes(marker),
      pageCount: reloaded.pageCount,
    })
  } catch (e) {
    Object.assign(window.__gate, { done: true, ok: false, error: String(e && e.stack || e) })
  }
})()
</script>
</body>
</html>
